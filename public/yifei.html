<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <button class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">画册</a></li>

      <li><a href="timeline.html">时光轴</a></li>
    </ul>
  </div>

<section class="child-hero yifei">
  <div class="dot-row">
    <span class="d" style="background:var(--yifei)"></span>
    <span class="d" style="background:var(--pink)"></span>
    <span class="d" style="background:var(--lavender)"></span>
  </div>
  <div class="child-initial">霏</div>
  <h1>羿霏 · 圆圆</h1>
  <p class="hero-desc">2010年8月28日 · 3岁起学画<br>现就读美术高中，备考美术学院<br>从水粉涂鸦到长期素描，笔触在时间里沉淀</p>
  <div class="hero-tags">
    <span class="hero-tag">持续创作中</span>
    <span class="hero-tag">美术高中在读</span>
    <span class="hero-tag">备考美院</span>
    <span class="hero-tag">13年画龄</span>
  </div>
</section>

<div class="filters">
  <button class="filter-btn active">全部作品</button>
  <button class="filter-btn">2024-2026</button>
  <button class="filter-btn">2021-2023</button>
  <button class="filter-btn">2018-2020</button>
  <button class="filter-btn">2015-2017</button>
  <button class="filter-btn">2013-2014</button>
</div>

<div class="section" style="padding-top:0"><div class="gallery" id="yifei-gallery"></div></div>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <button class="nav-btn prev" onclick="event.stopPropagation();navigateLightbox(-1)">&#8249;</button>
  <div class="lightbox-img-wrap"><img id="lightbox-img" src="" alt=""></div>
  <div class="info-bar" id="lightbox-info"></div>
  <button class="nav-btn next" onclick="event.stopPropagation();navigateLightbox(1)">&#8250;</button>
</div>

<footer>羿霏 & 羿丞 的绘画成长记录 · 2013 — 2026</footer>

<script src="js/data.js"></script><script src="js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{renderGallery('yifei-gallery',(typeof yifeiArtworks !== 'undefined' ? yifeiArtworks : artworks.filter(a=>a.child==='yifei'||a.child==='both')),'yifei');});</script>

</html>
